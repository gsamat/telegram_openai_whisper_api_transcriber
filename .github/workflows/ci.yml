---
name: CI

on:
  push:
    branches:
      - bot-from-scratch
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: make lint

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0

  build-image:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: Setup qemu
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        if: ${{ github.ref == 'refs/heads/bot-from-scratch' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image identifier
        id: image-identifier
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/bot-from-scratch' }}
          tags: |
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}:latest
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ steps.setup-project.outputs.python-version }}
            RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
